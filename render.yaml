services:
  - type: web
    name: skillroute-ai
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma db push && node scripts/seed.js && npm run build
    startCommand: npx prisma db push && node scripts/seed.js && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      - key: DATABASE_URL
        value: file:./dev.db
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
